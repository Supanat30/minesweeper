name: Build Android APK

on:
  push:
    branches: [ main ] # หุ่นยนต์จะทำงานทุกครั้งที่มีการกด Push โค้ดเข้าสาขา main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ดึงโค้ดจาก Repository
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ติดตั้ง Flutter SDK (เบื้องหลัง)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: ติดตั้ง Flet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: สั่ง Build APK
        run: flet build apk

      - name: อัปโหลดไฟล์ APK ให้เราดาวน์โหลด
        uses: actions/upload-artifact@v4
        with:
          name: Minesweeper-App-APK
          path: build/apk/app-release.apk