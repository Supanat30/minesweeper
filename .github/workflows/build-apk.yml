name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ดึงโค้ดจาก Repository
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ติดตั้ง Flet (สำหรับรันบนเซิร์ฟเวอร์เท่านั้น)
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: สั่ง Build APK (เฉพาะ 64-bit เพื่อลดขนาดไฟล์)
        run: yes | flet build apk --arch arm64

      - name: อัปโหลดไฟล์ APK ให้เราดาวน์โหลด
        uses: actions/upload-artifact@v4
        with:
          name: Minesweeper-App-APK
          path: build/**/*.apk