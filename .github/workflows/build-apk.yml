name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ดึงโค้ดจาก Repository
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ติดตั้ง Flutter SDK (ล็อคเวอร์ชัน 3.24.3)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      - name: ติดตั้ง Flet (ล็อคเวอร์ชัน 0.25.2)
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.25.2
          pip install -r requirements.txt

      - name: ลบไฟล์ขยะก่อนสร้างแอป
        run: rm -rf docs dist .venv venv __pycache__ .devcontainer

      - name: สั่ง Build APK
        run: flet build apk --arch arm64-v8a

      - name: อัปโหลดไฟล์ APK ให้เราดาวน์โหลด
        uses: actions/upload-artifact@v4
        with:
          name: Minesweeper-App-APK
          path: build/**/*.apk