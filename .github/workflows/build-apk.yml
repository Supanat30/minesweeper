name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ดึงโค้ดจาก Repository
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ลบ step ติดตั้ง Flutter ตัวเก่าออกไป เพราะ Flet จะจัดการเอง

      - name: ติดตั้ง Flet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: สั่ง Build APK (บังคับตอบ Yes อัตโนมัติ)
        run: yes | flet build apk

      - name: อัปโหลดไฟล์ APK ให้เราดาวน์โหลด
        uses: actions/upload-artifact@v4
        with:
          name: Minesweeper-App-APK
          path: build/apk/app-release.apk